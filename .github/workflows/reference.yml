name: Reference platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: agentic_payments
          POSTGRES_USER: agentic_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_ci -d agentic_payments"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYMENTS_DB_URL: jdbc:postgresql://127.0.0.1:5432/agentic_payments
      PAYMENTS_DB_USER: agentic_ci
      PAYMENTS_DB_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - name: Install verified Maven distribution
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o .tools/maven.tar.gz
          curl --fail --location --retry 3 https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz.sha512 -o .tools/maven.sha512
          printf '%s  %s\n' "$(cat .tools/maven.sha512)" '.tools/maven.tar.gz' | sha512sum --check
          tar -xzf .tools/maven.tar.gz -C .tools
          echo "$PWD/.tools/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Install pinned client dependencies
        run: |
          python -m pip install -r workflows/requirements-lock.txt
          python -m pip install -r integrations/offline_lab/requirements-crypto.lock.txt
          npm ci --ignore-scripts --prefix ui
      - name: Install verified local Temporal runtime
        run: |
          python scripts/bootstrap_temporal.py
          echo "PAYMENTS_TEMPORAL_CLI=$PWD/.tools/temporal-1.10.0/temporal" >> "$GITHUB_ENV"
      - name: Hydrate immutable upstream schema probes
        run: python integrations/upstream/probe_contracts.py --fetch --include-offline-lab --include-ap2-vectors
      - name: Run version-bound reference evidence suite
        run: python scripts/conformance.py
      - name: Show evidence summary
        id: evidence
        if: always()
        run: python -m scripts.requirement_evidence --bundle target/conformance --verify-only
      - name: Preserve safe current-run evidence bundle
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-evidence-${{ github.sha }}
          path: target/conformance/
          if-no-files-found: warn
          retention-days: 30
